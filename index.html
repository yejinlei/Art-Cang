{name:'时大彬',type:'工艺家',birth:1573,death:1648,era:'明代',tags:'壶家妙手称三大',desc:'明代宜兴制壶大师，时鹏之子，“三大”之首，改大壶为小壶，紫砂壶工艺巅峰，“宫中艳说大彬壶”。',works:'大彬三足如意壶、提梁壶'},
{name:'陆子冈',type:'工艺家',birth:1522,death:1620,era:'明代',tags:'子冈牌·琢玉圣手',desc:'明代苏州玉雕大师，“子冈牌”创始人，碾玉妙手，青玉白玉皆精，玉雕史上第一宗匠，“陆子冈治玉第一人”。',works:'子冈牌、白玉簪、合卺杯'}

// 类型配置
const typeConfig = {
'诗人':{color:'#c41e3a',icon:'📜'},
'画家':{color:'#2e8b57',icon:'🖌️'},
'书家':{color:'#2c5aa0',icon:'✍️'},
'琴家':{color:'#9370db',icon:'🎵'},
'茶人':{color:'#8b4513',icon:'🍵'},
'棋手':{color:'#2f4f4f',icon:'♟️'},
'武师':{color:'#b8860b',icon:'⚔️'},
'工艺家':{color:'#cd5c5c',icon:'🔨'}
};

const eraNames = {'-500':'先秦','-200':'秦汉','0':'两汉','200':'魏晋','400':'南北朝','600':'初唐','700':'盛唐','800':'晚唐五代','1000':'北宋','1200':'南宋元','1400':'明代','1600':'明末清初','1800':'清代'};
function getEra(year){ for(let k in eraNames) if(year<parseInt(k)) return eraNames[k]; return '近现代'; }

// ========== 全局时空宇宙 Canvas 实现 ==========
const canvas = document.getElementById('spaceCanvas');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('timeSlider');
const yearDisplay = document.getElementById('yearDisplay');
const tooltip = document.getElementById('spaceTooltip');
const detailModal = document.getElementById('personDetail');
const detailContent = document.getElementById('detailContent');
let currentYear = 700;
let mouseX=0, mouseY=0;
let hoveredPerson=null;
let stars = []; // 背景星空粒子
let personStars = []; // 人物星辰

// 初始化Canvas尺寸
function resizeCanvas(){
 const rect = canvas.parentElement.getBoundingClientRect();
 canvas.width = rect.width;
 canvas.height = rect.height;
 // 为每个人物随机分配位置
 personStars = allPeople.map(p => ({
 ...p,
 x: Math.random()*(canvas.width-100)+50,
 y: Math.random()*(canvas.height-150)+50,
 r: 6 + Math.random()*4,
 twinkle: Math.random()*Math.PI*2,
 speed: 0.02 + Math.random()*0.03
 }));
 // 生成背景星星
 stars = [];
 for(let i=0;i<300;i++){
 stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5,twinkle:Math.random()*Math.PI*2,speed:0.01+Math.random()*0.02});
 }
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// 时间轴事件
slider.addEventListener('input', () => {
 currentYear = parseInt(slider.value);
 const era = getEra(currentYear);
 yearDisplay.textContent = `公元 ${currentYear>0?currentYear:'前'+Math.abs(currentYear)} 年 · ${era}`;
});

// 鼠标移动事件
canvas.addEventListener('mousemove', (e) => {
 const rect = canvas.getBoundingClientRect();
 mouseX = e.clientX - rect.left;
 mouseY = e.clientY - rect.top;
 // 检测悬停人物
 hoveredPerson = null;
 for(let ps of personStars){
 const life = ps.birth < currentYear && currentYear < ps.death;
 if(life){
 const dx = ps.x - mouseX;
 const dy = ps.y - mouseY;
 if(dx*dx + dy*dy < (ps.r+8)*(ps.r+8)){
 hoveredPerson = ps;
 break;
 }
 }
 }
 if(hoveredPerson){
 tooltip.style.display = 'block';
 tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
 tooltip.style.top = (e.clientY - rect.top + 15) + 'px';
 tooltip.innerHTML = `<div style="color:#d4af37;font-size:16px;font-weight:700;margin-bottom:4px;">${hoveredPerson.name} <span style="font-size:12px;opacity:0.8;">${hoveredPerson.era}·${hoveredPerson.type}</span></div>
<div style="font-size:13px;opacity:0.9;">${hoveredPerson.tags}</div>
<div style="font-size:12px;margin-top:4px;">生卒：${hoveredPerson.birth>0?hoveredPerson.birth:'前'+Math.abs(hoveredPerson.birth)} - ${hoveredPerson.death>0?hoveredPerson.death:'前'+Math.abs(hoveredPerson.death)} 在世年龄：${hoveredPerson.death-hoveredPerson.birth}岁</div>`;
 canvas.style.cursor = 'pointer';
 } else {
 tooltip.style.display = 'none';
 canvas.style.cursor = 'default';
 }
});

canvas.addEventListener('mouseleave', () => {
 tooltip.style.display = 'none';
 hoveredPerson = null;
});

// 点击人物显示详情
canvas.addEventListener('click', () => {
 if(hoveredPerson){
 detailContent.innerHTML = `<div style="text-align:center;margin-bottom:20px;">
<h3 style="color:#8B2323;font-size:28px;margin-bottom:8px;">${hoveredPerson.name}</h3>
<p style="color:#5c4033;font-size:16px;">${hoveredPerson.era} · ${typeConfig[hoveredPerson.type].icon} ${hoveredPerson.type} · ${hoveredPerson.tags}</p>
<p style="color:#888;margin-top:5px;">生卒：${hoveredPerson.birth>0?hoveredPerson.birth:'前'+Math.abs(hoveredPerson.birth)} - ${hoveredPerson.death>0?hoveredPerson.death:'前'+Math.abs(hoveredPerson.death)} 在世年龄：${hoveredPerson.death-hoveredPerson.birth}岁</p>
</div>
<div style="font-size:17px;line-height:1.8;color:#2c2c2c;text-indent:2em;margin-bottom:20px;">${hoveredPerson.desc}</div>
<div style="background:#f8f4e9;padding:15px;border-radius:8px;border-left:4px solid #d4af37;">
<p style="font-weight:600;color:#8B2323;margin-bottom:8px;">📚 代表作品</p>
<p style="font-size:15px;line-height:1.6;">${hoveredPerson.works||'作品流传千古'}</p>
</div>`;
 detailModal.style.display = 'block';
 }
});
document.getElementById('personDetail').addEventListener('click',(e)=>{ if(e.target.id==='personDetail') detailModal.style.display='none'; });

// 绘制动画循环
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 // 背景渐变
 const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width/1.2);
 grad.addColorStop(0, '#1a0f0a');
 grad.addColorStop(1, '#050201');
 ctx.fillStyle = grad;
 ctx.fillRect(0,0,canvas.width,canvas.height);
 // 背景星空闪烁
 for(let s of stars){
 s.twinkle += s.speed;
 const alpha = 0.3 + Math.sin(s.twinkle)*0.3;
 ctx.beginPath();
 ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
 ctx.fillStyle = `rgba(255,255,255,${alpha})`;
 ctx.fill();
 }
 // 绘制同类型人物淡金色连线（同在世且距离<200）
 const alivePeople = personStars.filter(p => p.birth < currentYear && currentYear < p.death);
 for(let i=0;i<alivePeople.length;i++){
 for(let j=i+1;j<alivePeople.length;j++){
 const p1 = alivePeople[i], p2=alivePeople[j];
 if(p1.type === p2.type){
 const dx=p1.x-p2.x, dy=p1.y-p2.y, d=Math.sqrt(dx*dx+dy*dy);
 if(d<200){
 ctx.beginPath();
 ctx.moveTo(p1.x,p1.y);
 ctx.lineTo(p2.x,p2.y);
 const tconf = typeConfig[p1.type];
 ctx.strokeStyle = tconf.color + '33'; // 20%透明度
 ctx.lineWidth = 1;
 ctx.stroke();
 }
 }
 }
 }
 // 绘制人物星辰
 for(let ps of personStars){
 ps.twinkle += ps.speed;
 const tconf = typeConfig[ps.type];
 const alive = ps.birth < currentYear && currentYear < ps.death;
 const alpha = alive ? 0.9+Math.sin(ps.twinkle)*0.1 : 0.15;
 // 光晕
 if(alive || hoveredPerson===ps){
 const haloGrad = ctx.createRadialGradient(ps.x,ps.y,0,ps.x,ps.y,ps.r*4);
 haloGrad.addColorStop(0, tconf.color + '88');
 haloGrad.addColorStop(1, tconf.color + '00');
 ctx.fillStyle = haloGrad;
 ctx.beginPath();
 ctx.arc(ps.x,ps.y,ps.r*4,0,Math.PI*2);
 ctx.fill();
 }
 // 星辰本体
 ctx.beginPath();
 ctx.arc(ps.x,ps.y,ps.r,0,Math.PI*2);
 ctx.fillStyle = alive ? tconf.color : '#555555';
 ctx.globalAlpha = alpha;
 ctx.fill();
 ctx.globalAlpha = 1;
 // 悬停放大
 if(hoveredPerson===ps){
 ctx.beginPath();
 ctx.arc(ps.x,ps.y,ps.r*1.8,0,Math.PI*2);
 ctx.strokeStyle = '#d4af37';
 ctx.lineWidth = 2;
 ctx.stroke();
 // 显示名字在星辰上方
 ctx.font = '16px Noto Serif SC';
 ctx.fillStyle = '#fff';
 ctx.textAlign='center';
 ctx.fillText(ps.name, ps.x, ps.y - ps.r*3);
 }
 }
 // 绘制时间线当前年的光带
 ctx.fillStyle = 'rgba(212,175,55,0.08)';
 ctx.fillRect(0,0,canvas.width,canvas.height);
 requestAnimationFrame(draw);
}
draw();

// ========== 匠师名录渲染 ==========
const peopleGrid = document.getElementById('peopleGrid');
const filterBtns = document.querySelectorAll('#peopleFilter button');
let currentFilter = 'all';

function renderPeople(){
 peopleGrid.innerHTML = '';
 const filtered = currentFilter==='all' ? allPeople : allPeople.filter(p=>p.type===currentFilter);
 filtered.forEach(p => {
 const tconf = typeConfig[p.type];
 const card = document.createElement('div');
 card.className = 'card';
 card.style.borderLeft = `4px solid ${tconf.color}`;
 card.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:10px;">
<h3 style="font-size:20px;color:#2c2c2c;">${p.name}</h3>
<span style="font-size:13px;color:#666;padding:3px 8px;background:#f0ece0;border-radius:4px;">${p.era}</span>
</div>
<div style="margin-bottom:8px;"><span style="font-size:13px;color:#fff;padding:2px 8px;border-radius:10px;background:${tconf.color};">${tconf.icon} ${p.type}</span></div>
<p style="font-size:15px;color:#d4af37;margin-bottom:8px;font-weight:500;">${p.tags}</p>
<p style="font-size:13px;color:#666;line-height:1.6;">生卒：${p.birth>0?p.birth:'前'+Math.abs(p.birth)} - ${p.death>0?p.death:'前'+Math.abs(p.death)} · 享年${p.death-p.birth}岁</p>`;
 card.onclick = ()=>{
 detailContent.innerHTML = `<div style="text-align:center;margin-bottom:20px;">
<h3 style="color:#8B2323;font-size:28px;margin-bottom:8px;">${p.name}</h3>
<p style="color:#5c4033;font-size:16px;">${p.era} · ${tconf.icon} ${p.type} · ${p.tags}</p>
<p style="color:#888;margin-top:5px;">生卒：${p.birth>0?p.birth:'前'+Math.abs(p.birth)} - ${p.death>0?p.death:'前'+Math.abs(p.death)} 在世年龄：${p.death-p.birth}岁</p>
</div>
<div style="font-size:17px;line-height:1.8;color:#2c2c2c;text-indent:2em;margin-bottom:20px;">${p.desc}</div>
<div style="background:#f8f4e9;padding:15px;border-radius:8px;border-left:4px solid #d4af37;">
<p style="font-weight:600;color:#8B2323;margin-bottom:8px;">📚 代表作品</p>
<p style="font-size:15px;line-height:1.6;">${p.works||'作品流传千古'}</p>
</div>`;
 detailModal.style.display='block';
 document.getElementById('space').scrollIntoView({behavior:'smooth'});
 };
 peopleGrid.appendChild(card);
 });
}
renderPeople();

filterBtns.forEach(btn => {
 btn.addEventListener('click', () => {
 filterBtns.forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 currentFilter = btn.dataset.type;
 renderPeople();
 });
});

// 导航平滑滚动
document.querySelectorAll('.nav-links a').forEach(a=>{
 a.addEventListener('click',(e)=>{
 e.preventDefault();
 document.querySelectorAll('.nav-links a').forEach(x=>x.classList.remove('active'));
 a.classList.add('active');
 const id = a.getAttribute('href').slice(1);
 document.getElementById(id).scrollIntoView({behavior:'smooth'});
 });
});

// 关闭详情点击空白
window.addEventListener('click',(e)=>{
 if(e.target === detailModal) detailModal.style.display='none';
});
</script>
</body>
</html>
